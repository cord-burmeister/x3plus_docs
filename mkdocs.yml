site_name: X3Plus Documentation
site_description: DIY robot projects as learning journey
site_author: Cord Burmeister
copyright: '2025, Cord Burmeister'
docs_dir: docs
site_url: https://cord-burmeister.github.io/x3plus_docs/
repo_url: https://github.com/cord-burmeister/x3plus_docs
plugins:
  - literate-nav:
      nav_file: SUMMARY.md
  - search
  - git-revision-date-localized  
  - bibtex:
      bib_file: "refs.bib"
      csl_file: "templates/apa.csl"

theme:
  name: material
  logo: assets/logo.svg
  palette:
    primary: 'indigo'
    accent: 'indigo'
  features:
    - navigation.top
    - navigation.expand
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- footnotes  
- pymdownx.arithmatex:
    generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/config.js

